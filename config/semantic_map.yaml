# ------------------------------------------------------------------------------
# 3. DYNAMIC / TEMPORARY SIGN MUTATIONS (FOR V2.4 SCENARIO TESTING)
# Demonstrates changing sign understanding where visual observation overrides map priors
# ------------------------------------------------------------------------------
dynamic_sign_scenarios:
  scenario_storage_closed:
    target_sign_id: "sign_j7_storage"
    new_text: "STORAGE CLOSED"
    new_direction: "BLOCKED"
    new_texture_file: "storage_closed.png"
    action: "PENALIZE_EDGE"
    penalty_factor: 10.0

  scenario_storage_detour:
    target_sign_id: "sign_j3_storage"
    new_text: "STORAGE"
    new_direction: "LEFT"  # Changed from RIGHT to LEFT detour
    new_texture_file: "storage_left.png"
