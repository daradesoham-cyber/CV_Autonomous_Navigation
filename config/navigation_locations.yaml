# ==============================================================================
# Predefined Start and Goal Navigation Locations for Complex 30m x 30m World
# Coordinates verified for free space (>0.6m clearance) against complex_map.pgm
# ==============================================================================

locations:
  # Primary Demonstration Scenario A (Plaza to Warehouse South)
  start_a:
    x: -10.0
    y: -10.0
    yaw: 0.0
    description: "Zone A: Open Plaza - South-West initial robot spawn point"

  goal_a:
    x: 10.0
    y: -10.0
    yaw: 0.0
    description: "Zone B: Warehouse South Corridor (east of divider)"

  # Primary Demonstration Scenario B (North-West Plaza to North-East Office)
  start_b:
    x: -10.0
    y: 5.0
    yaw: 1.57
    description: "Zone C: North-West entrance open area"

  goal_b:
    x: 8.0
    y: 8.0
    yaw: 0.0
    description: "Zone C: North-East Office Area"

  # Primary Demonstration Scenario C (Warehouse to Hospital Wing)
  start_c:
    x: 5.0
    y: -2.0
    yaw: 3.14
    description: "Zone B: Warehouse Main Aisle (clear of shelves/boxes)"

  goal_c:
    x: -8.0
    y: 8.0
    yaw: 1.57
    description: "Zone C: Hospital Wing Room entrance"

  # Additional High-Traffic Navigation Landmarks
  plaza_center:
    x: -6.0
    y: -5.0
    yaw: 0.0
    description: "Zone A: Plaza central transit zone"

  central_archway:
    x: 0.0
    y: 2.0
    yaw: 1.57
    description: "Corridor passage connecting South and North zones"

  warehouse_corridor:
    x: 6.0
    y: -2.0
    yaw: 0.0
    description: "Zone B: Warehouse northern transit lane"

  hospital_hallway:
    x: 0.0
    y: 8.0
    yaw: 1.57
    description: "Zone C: Hospital central hallway"
